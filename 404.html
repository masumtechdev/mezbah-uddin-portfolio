<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <meta
    name="robots"
    content="noindex, follow"
  >

  <meta
    name="theme-color"
    content="#062d2d"
  >

  <title>
    Page Not Found | Mezbah Uddin
  </title>

  <link
    rel="icon"
    href="./favicon.svg"
    type="image/svg+xml"
  >

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    html,
    body {
      min-height: 100%;
    }

    body {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 30px;
      color: #ffffff;
      background:
        radial-gradient(
          circle at 80% 20%,
          rgba(114, 216, 193, 0.12),
          transparent 28%
        ),
        linear-gradient(
          145deg,
          #062d2d,
          #031d1e
        );
      font-family:
        "Segoe UI",
        Arial,
        Helvetica,
        sans-serif;
      text-align: center;
    }

    .error-page {
      width: min(620px, 100%);
    }

    .logo {
      width: 70px;
      height: 70px;
      display: grid;
      place-items: center;
      margin: 0 auto 32px;
      color: #062d2d;
      background:
        linear-gradient(
          145deg,
          #a6ead9,
          #9fda71
        );
      border-radius: 20px 8px 20px 8px;
      font-size: 18px;
      font-weight: 900;
      letter-spacing: 0.08em;
      box-shadow:
        0 18px 40px
        rgba(0, 0, 0, 0.18);
    }

    .code {
      display: inline-block;
      margin-bottom: 18px;
      color: #72d8c1;
      font-size: 11px;
      font-weight: 800;
      letter-spacing: 0.16em;
      text-transform: uppercase;
    }

    h1 {
      margin-bottom: 18px;
      font-size:
        clamp(
          40px,
          8vw,
          68px
        );
      line-height: 1.05;
      letter-spacing: -0.05em;
    }

    p {
      max-width: 480px;
      margin: 0 auto 32px;
      color:
        rgba(255, 255, 255, 0.62);
      font-size: 15px;
      line-height: 1.8;
    }

    a {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 9px;
      min-height: 52px;
      padding: 0 23px;
      color: #062d2d;
      background:
        linear-gradient(
          135deg,
          #9fda71,
          #a6ead9
        );
      border-radius: 12px;
      font-size: 13px;
      font-weight: 800;
      text-decoration: none;
      transition:
        transform 0.3s ease,
        background 0.3s ease;
    }

    a:hover {
      background: #ffffff;
      transform: translateY(-3px);
    }

    @media (max-width: 500px) {
      body {
        padding: 22px;
      }

      .logo {
        width: 60px;
        height: 60px;
        margin-bottom: 25px;
      }

      h1 {
        font-size: 42px;
      }
    }
  </style>
</head>

<body>

  <main class="error-page">

    <div class="logo">
      MU
    </div>

    <span class="code">
      ERROR 404
    </span>

    <h1>
      This page could not be found.
    </h1>

    <p>
      The address may be incorrect or the page may have moved.
      Return to the official Mezbah Uddin portfolio homepage.
    </p>

    <a
      href="https://masumtechdev.github.io/mezbah-uddin-portfolio/"
    >
      Return to Homepage ↗
    </a>

  </main>

</body>
</html>
