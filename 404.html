<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <meta
    name="robots"
    content="noindex, follow"
  >

  <meta
    name="theme-color"
    content="#062a2b"
  >

  <title>
    Page Not Found | Mezbah Uddin
  </title>

  <link
    rel="icon"
    href="./favicon.svg"
    type="image/svg+xml"
  >

  <style>
    * {
      box-sizing: border-box;
    }

    html,
    body {
      min-height: 100%;
    }

    body {
      display: grid;
      place-items: center;
      margin: 0;
      padding: 24px;
      color: #ffffff;
      background:
        radial-gradient(
          circle at 80% 20%,
          rgba(120, 232, 206, 0.12),
          transparent 30%
        ),
        radial-gradient(
          circle at 15% 85%,
          rgba(201, 239, 99, 0.08),
          transparent 25%
        ),
        #062a2b;
      font-family:
        "Segoe UI",
        Arial,
        Helvetica,
        sans-serif;
    }

    .card {
      width: min(100%, 680px);
      padding: clamp(34px, 7vw, 70px);
      text-align: center;
      background: rgba(255, 255, 255, 0.045);
      border: 1px solid rgba(255, 255, 255, 0.13);
      border-radius: 30px;
      box-shadow: 0 35px 90px rgba(0, 0, 0, 0.3);
      backdrop-filter: blur(18px);
    }

    .logo {
      display: grid;
      place-items: center;
      width: 64px;
      height: 64px;
      margin: 0 auto 28px;
      color: #062a2b;
      background: linear-gradient(
        145deg,
        #78e8ce,
        #c9ef63
      );
      border-radius: 18px 8px 18px 8px;
      font-size: 17px;
      font-weight: 800;
    }

    .code {
      display: block;
      margin-bottom: 16px;
      color: #78e8ce;
      font-size: 13px;
      font-weight: 800;
      letter-spacing: 0.18em;
    }

    h1 {
      margin: 0 0 18px;
      font-size: clamp(42px, 8vw, 74px);
      line-height: 1.05;
      letter-spacing: -0.055em;
    }

    p {
      max-width: 500px;
      margin: 0 auto 32px;
      color: rgba(255, 255, 255, 0.62);
      font-size: 16px;
      line-height: 1.8;
    }

    a {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      min-height: 52px;
      padding: 0 24px;
      color: #062a2b;
      background: linear-gradient(
        135deg,
        #c9ef63,
        #78e8ce
      );
      border-radius: 15px;
      font-size: 14px;
      font-weight: 800;
      text-decoration: none;
      transition:
        background 0.3s ease,
        transform 0.3s ease;
    }

    a:hover {
      background: #ffffff;
      transform: translateY(-3px);
    }
  </style>
</head>

<body>

  <main class="card">

    <div class="logo">
      MU
    </div>

    <span class="code">
      ERROR 404
    </span>

    <h1>
      This page could not be found.
    </h1>

    <p>
      The address may be incorrect or the page may have moved.
    </p>

    <a href="./">
      Return to Homepage
    </a>

  </main>

</body>
</html>
